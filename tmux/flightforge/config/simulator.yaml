uav_names: [
  "uav1",
]

frames:
  fcu:
    publish_tf: false

uav1:

  frame: "x500"
  type: "x500"
  spawn:
    x: -18.0
    y: 27.0
    z: 0.0
    heading: -1.5708

mrs_uav_flightforge_simulator:

  sensors:

    lidar:

      enabled: false

    rgb:

      rate: 30 # [Hz]

      enabled: true

      rgb_segmented:
        enabled: false
        rate: 10.0 # [Hz]

      depth:
        enabled: false

    stereo:
      enabled: false

  graphics_settings: "high"

  realtime_factor: 1.0 # [-]

  # world_name: "valley" # works in Lite
  world_name: "warehouse" # works in Lite

